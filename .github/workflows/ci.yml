name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyyaml        # the agent itself needs only the standard library
      - run: pytest -q agent/tests

  deploy-files:
    name: Deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for f in deploy/systemd/*.sh agent/*.sh; do bash -n "$f"; done
      - name: Kubernetes manifests parse
        run: python3 -c "import yaml,sys; [list(yaml.safe_load_all(open(f))) for f in sys.argv[1:]]" deploy/kubernetes/*.yaml
      - name: Docker image builds
        run: docker build -q agent
